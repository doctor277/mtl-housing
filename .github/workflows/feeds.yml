name: GTFS feeds

# Weekly check (M5.5): has the STM, REM or exo published a new schedule file, or does one end
# within 30 days? Runs only `refresh-feeds --check` (downloads to a temp dir, no routing, no
# commit). If something needs attention it opens an Issue; while that Issue is open, a new
# finding is added as a comment and a finding it already lists is skipped (no duplicates).
# The refresh itself stays a local command (`refresh-feeds`, then `refresh --date …`).
# A failed download fails the job, so GitHub's failed-run e-mail is the alert for that.

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays 12:00 UTC (08:00 in Montréal in summer, 07:00 in winter)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feeds
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -el {0} # login shell so the micromamba env is active
    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: pipeline/environment.yml
          cache-environment: true

      - name: Install pipeline package
        run: pip install -e pipeline --no-deps

      - name: Check the feeds
        working-directory: pipeline
        run: python -m mtlhousing refresh-feeds --check --report "$RUNNER_TEMP/feeds.md"

      # One open Issue at most: a new finding becomes a comment on it, a repeat is skipped.
      - name: Open the Issue, or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash .github/scripts/feeds_issue.sh "$RUNNER_TEMP/feeds.md"
          "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
