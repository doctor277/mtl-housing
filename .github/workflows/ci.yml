name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0} # login shell so the micromamba env is active
    steps:
      - uses: actions/checkout@v7

      # Same conda-forge env as local (pipeline/environment.yml), cached by its hash.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: pipeline/environment.yml
          cache-environment: true

      - name: Install pipeline package
        run: pip install -e pipeline --no-deps

      - name: Ruff
        working-directory: pipeline
        run: |
          ruff check .
          ruff format --check .

      # Tests needing data/raw or pipeline outputs skip themselves when the files are absent.
      # Tests that start the JVM are marked `java` and run locally only.
      - name: Pytest (without Java tests)
        working-directory: pipeline
        run: pytest -m "not java"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web tests (Vitest)
        working-directory: web
        run: npm test

      - name: Web build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
